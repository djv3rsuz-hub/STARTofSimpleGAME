# ============================================
# Character Settings - Edit in Notepad
# Restart game to apply changes
# ============================================
#
# Supported color names:
#   Red, Green, Blue, Yellow, Orange, Purple, Pink,
#   White, Black, Gray, Cyan, Magenta, Brown,
#   DodgerBlue, LimeGreen, Gold, Silver, Tomato,
#   Crimson, Navy, Teal, Maroon, Olive, etc.
#
# Or use hex: #AARRGGBB (Alpha, Red, Green, Blue)
#   Example: #FF1E90FF = fully opaque DodgerBlue
#
# Stats format: 0.00 = 0%, 1.00 = 100%
#   Example: 0.50 = 50%, 1.50 = 150%
#
# ============================================

[PlayerCube]
# Name shown in debug display
Name = Blue Cube
# Starting position on game screen (0,0 = top-left)
StartX = 100
StartY = 310
# Size in pixels (width and height)
Size = 60
# Max movement speed in pixels per second
MoveSpeed = 720
# How fast to reach max speed (pixels/sec^2). Higher = snappier start.
AccelerationSpeed = 9000
# How fast to stop when input released (pixels/sec^2). Higher = quicker stop.
DecelerationSpeed = 0
# Can the player control this cube?
Controllable = true
# Color (see supported names above)
Color = DodgerBlue
# Border color, "none" for no border
BorderColor = White
# Border thickness in pixels
BorderThickness = 1
# If true, object stops at game screen edges
ClampToScreen = true

# --- Dash Action ---
# Controller: B button | Keyboard: Space
# Dash distance in pixels
DashDistance = 50
# Rotation speed during dash (degrees per second, 360 = one full spin)
DashRotationSpeed = 2160
# Cooldown between dashes in seconds
DashCooldown = 0.8
# Duration of the dash in seconds (lower = faster dash)
DashDuration = 0.12

# --- RPG Stats (0.00 = 0%, 1.00 = 100%) ---
# Health Points (current/max ratio, 1.00 = full HP)
HP = 1.00
# Damage reduction from incoming attacks (0.00 = none, 1.00 = immune)
Defence = 0.10
# Base attack power dealt to enemies
Attack = 0.15
# Attack speed multiplier (1.00 = normal, 2.00 = double speed)
AttackSpeed = 1.00
# Resistance to status effects (0.00 = none, 1.00 = immune)
Resistance = 0.05
# Chance to dodge incoming attack (0.00 = never, 1.00 = always)
DodgeChance = 0.05
# Chance to land critical hit (0.00 = never, 1.00 = always)
CriticalChance = 0.10
# Critical hit damage multiplier (1.50 = 150% damage)
CriticalDamage = 1.50
# Main/physical damage output
MainDamage = 0.20
# Skill/magical damage output
SkillDamage = 0.10
# Damage dealt when parrying an attack
ParryDamage = 0.25
# Damage dealt when countering an attack
CounterDamage = 0.30

# --- AI Action Toggles (true/false) ---
DashEnabled = true

