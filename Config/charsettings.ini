# ============================================
# Character Settings - Edit in Notepad
# Restart game to apply changes
# ============================================
#
# Supported color names:
#   Red, Green, Blue, Yellow, Orange, Purple, Pink,
#   White, Black, Gray, Cyan, Magenta, Brown,
#   DodgerBlue, LimeGreen, Gold, Silver, Tomato,
#   Crimson, Navy, Teal, Maroon, Olive, etc.
#
# Or use hex: #AARRGGBB (Alpha, Red, Green, Blue)
#   Example: #FF1E90FF = fully opaque DodgerBlue
#
# ============================================

[PlayerCube]
# Name shown in debug display
Name = Blue Cube
# Starting position on game screen (0,0 = top-left)
StartX = 100
StartY = 310
# Size in pixels (width and height)
Size = 80
# Max movement speed in pixels per second
MoveSpeed = 350
# How fast to reach max speed (pixels/sec^2). Higher = snappier start.
# Set to 0 for instant speed (no acceleration).
AccelerationSpeed = 1200
# How fast to stop when input released (pixels/sec^2). Higher = quicker stop.
# Set to 0 for instant stop (no deceleration).
DecelerationSpeed = 900
# Can the player control this cube?
Controllable = true
# Color (see supported names above)
Color = DodgerBlue
# Border color, "none" for no border
BorderColor = White
# Border thickness in pixels
BorderThickness = 1
# If true, object stops at game screen edges
ClampToScreen = true

[EnemyCube]
Name = Red Cube
StartX = 1100
StartY = 310
Size = 80
MoveSpeed = 0
AccelerationSpeed = 0
DecelerationSpeed = 0
Controllable = false
Color = Red
BorderColor = White
BorderThickness = 1
ClampToScreen = true

